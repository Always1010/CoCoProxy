# Synthetic role address and authority; replace together with management.origin.
worker_processes 1;
pid /run/coproxy-web/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 4m;
    client_body_temp_path /var/lib/coproxy-web/client;
    proxy_temp_path /var/lib/coproxy-web/proxy;
    fastcgi_temp_path /var/lib/coproxy-web/fastcgi;
    uwsgi_temp_path /var/lib/coproxy-web/uwsgi;
    scgi_temp_path /var/lib/coproxy-web/scgi;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 192.0.2.2:13443 ssl;
        server_name gateway.example;
        ssl_certificate /etc/coproxy/web/server.crt;
        ssl_certificate_key /etc/coproxy/web/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Browsers may infer HTTP when the user types only the LAN authority.
        # Always redirect to this configured HTTPS authority, never a request Host.
        error_page 497 =308 https://gateway.example:13443$request_uri;
        if ($http_host != "gateway.example:13443") { return 421; }
        location / {
            proxy_pass http://127.0.0.1:13000;
            proxy_http_version 1.1;
            proxy_set_header Host "gateway.example:13443";
            proxy_set_header X-Forwarded-Host "gateway.example:13443";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 13443;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 75s;
        }
    }
}
